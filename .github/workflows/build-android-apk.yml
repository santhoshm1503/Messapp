
name: Build VIT MessMate Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          test -n "$ZIP"
          mkdir extracted
          unzip "$ZIP" -d extracted
          PROJECT=$(find extracted -name package.json | head -n 1 | xargs dirname)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          cd "$PROJECT"
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Build web application
        run: |
          cd "$PROJECT"
          npm run build

      - name: Configure Android
        run: |
          cd "$PROJECT"
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.santhoshm1503.vitmessmate',
            appName: 'VIT MessMate',
            webDir: 'dist',
            server: {
              androidScheme: 'https'
            }
          };

          export default config;
          EOF

          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIT-MessMate-APK
          path: ${{ env.PROJECT }}/android/app/build/outputs/apk/debug/app-debug.apk
          
