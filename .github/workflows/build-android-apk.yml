name: Build VIT MessMate APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          test -n "$ZIP"
          mkdir extracted
          unzip "$ZIP" -d extracted
          PROJECT=$(find extracted -name package.json | head -n 1 | xargs dirname)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Install and build
        run: |
          cd "$PROJECT"
          npm install
          npm run build
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VIT-MessMate-APK
          path: ${{ env.PROJECT }}/android/app/build/outputs/apk/debug/app-debug.apk
          
